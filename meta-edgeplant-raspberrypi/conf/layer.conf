# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-edgeplant-raspberrypi"
BBFILE_PATTERN_meta-edgeplant-raspberrypi = "^${LAYERDIR}/"

LAYERDEPENDS_meta-edgeplant-raspberrypi += "core"
LAYERDEPENDS_meta-edgeplant-raspberrypi += "raspberrypi"

LAYERSERIES_COMPAT_meta-edgeplant-raspberrypi = "scarthgap"
