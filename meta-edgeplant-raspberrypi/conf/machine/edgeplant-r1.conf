#@TYPE: Machine
#@NAME: EDGEPLANT R1 (CM4 64bit)
#@DESCRIPTION: Machine configuration for EDGEPLANT R1 (CM4 64bit)

MACHINEOVERRIDES =. "raspberrypi4:"

MACHINE_FEATURES += "pci"
# Unnecessary if Wi-Fi/Bluetooth is not used or not present.
#MACHINE_EXTRA_RRECOMMENDS += "\
#    linux-firmware-rpidistro-bcm43455 \
#    bluez-firmware-rpidistro-bcm4345c0-hcd \
#    linux-firmware-rpidistro-bcm43456 \
#    bluez-firmware-rpidistro-bcm4345c5-hcd \
#"

require conf/machine/include/arm/armv8a/tune-cortexa72.inc
include conf/machine/include/rpi-base.inc

# Include only if supporting multiple Raspberry Pi models.
#RPI_KERNEL_DEVICETREE = " \
#    broadcom/bcm2711-rpi-4-b.dtb \
#    broadcom/bcm2711-rpi-400.dtb \
#    broadcom/bcm2711-rpi-cm4.dtb \
#    broadcom/bcm2711-rpi-cm4s.dtb \
#"
RPI_KERNEL_DEVICETREE = "broadcom/bcm2711-rpi-cm4.dtb"

SDIMG_KERNELIMAGE ?= "kernel8.img"
SERIAL_CONSOLES ?= "115200;ttyAMA0"

UBOOT_MACHINE = "rpi_arm64_config"

VC4DTBO ?= "vc4-kms-v3d"

# When u-boot is enabled we need to use the "Image" format and the "booti"
# command to load the kernel
KERNEL_IMAGETYPE_UBOOT ?= "Image"
# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

ARMSTUB ?= "armstub8-gic.bin"

# Enable RTC support
MACHINE_FEATURES += "rtc"
MACHINE_FEATURES_BACKFILL_CONSIDERED:remove = "rtc"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "\
    raspi-gpio \
    edgeplant-rpi-boot \
    edgeplant-raspi-tools \
    edgeplant-powermanage \
    kernel-module-i2c-dev \
"

RPI_KERNEL_DEVICETREE_OVERLAYS += "\
  overlays/ad7994.dtbo \
  overlays/can-usb.dtbo \
  overlays/lsm6dso-i2c.dtbo \
  overlays/mcp7940.dtbo \
  overlays/gpio-poweroff.dtbo \
  overlays/gpio-shutdown.dtbo \
  overlays/i2c0.dtbo \
  overlays/i2c5.dtbo \
  overlays/uart4.dtbo \
  overlays/eeprom-24lc32.dtbo \
  overlays/sd0.dtbo \
"

KERNEL_MODULE_AUTOLOAD += "ad799x iio-trig-hrtimer"
